name: Release

# push v* tag → 构建 sdist/wheel + 三端二进制 → 自动创建 GitHub Release 并附产物。
# 由 auto-tag.yml 自动打 tag 触发（GITHUB_TOKEN 推 tag 不触发 push，
# 由 dispatch 事件叫醒），也可手动 git tag v0.x.y && git push --tags。

on:
  push:
    tags: ["v*"]            # 手动 push tag 也能发版
  repository_dispatch:      # auto-tag.yml 打 tag 后显式叫醒
    types: [release]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - name: 校验 tag 与 pyproject 版本一致
        run: |
          TAG="${{ github.event.client_payload.tag || github.ref_name }}"
          VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          [ "v$VERSION" = "$TAG" ] || {
            echo "tag $TAG 与 pyproject 版本 v$VERSION 不一致"; exit 1; }
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-pypi
          path: dist/

  # -- 三端二进制：Windows exe / Linux AppImage / macOS（arm64 + x86_64）----
  build-bin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: bin-windows
          - os: ubuntu-22.04      # glibc 2.35，兼容 22.04+ 的 x86_64 发行版
            name: bin-linux
          - os: macos-14          # Apple Silicon
            name: bin-macos-arm64
          - os: macos-13          # Intel
            name: bin-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install . pyinstaller pillow
      - name: PyInstaller 单文件打包
        run: >
          pyinstaller --onefile --name wbspy --clean --noconfirm
          --collect-all wbspy wbspy/launcher.py
      - name: 冒烟（跑不起来不算构建成功）
        if: matrix.os == 'windows-latest'
        run: |
          .\dist\wbspy.exe --version
          .\dist\wbspy.exe accounts list
      - name: 冒烟
        if: matrix.os != 'windows-latest'
        run: |
          ./dist/wbspy --version
          ./dist/wbspy accounts list

      # -- Linux：组装 AppDir → AppImage ------------------------------------
      - name: 组装 AppImage
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/wbspy AppDir/usr/bin/wbspy
          python - <<'EOF'
          from PIL import Image, ImageDraw
          img = Image.new("RGB", (256, 256), "#0078d4")
          d = ImageDraw.Draw(img)
          d.rectangle([32, 32, 224, 224], outline="white", width=12)
          d.rectangle([76, 104, 180, 192], fill="white")
          img.save("wbspy.png")
          EOF
          cp wbspy.png AppDir/wbspy.png           # 图标必须在 AppDir 顶层，.DirIcon 由工具生成
          cat > AppDir/wbspy.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=WorkBuddy Switch
          Comment=多账号 · 扫码登录 · 积分自动化 · 本机 API 网关
          Exec=wbspy
          Icon=wbspy
          Categories=Development;
          Terminal=true
          EOF
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir --executable AppDir/usr/bin/wbspy --output appimage
          mv WorkBuddy_Switch-*.AppImage dist/wbspy-linux-x86_64.AppImage
      - name: AppImage 冒烟（CI 无 FUSE，用 extract-and-run）
        if: matrix.os == 'ubuntu-22.04'
        run: ./dist/wbspy-linux-x86_64.AppImage --appimage-extract-and-run --version

      # -- macOS：产物改名带架构 --------------------------------------------
      - name: 重命名 macOS 产物
        if: runner.os == 'macOS'
        run: >
          mv dist/wbspy dist/wbspy-macos-${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}
          && file dist/wbspy-macos-${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/wbspy.exe
            dist/wbspy-linux-x86_64.AppImage
            dist/wbspy-macos-*

  release:
    needs: [build, build-bin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                      # 生成「本版变更」需要提交历史
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-pypi
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist/
          merge-multiple: true
      - run: ls -lh dist/
      - name: 生成发布说明（安装指引 + 自动变更日志）
        run: |
          TAG="${{ github.event.client_payload.tag || github.ref_name }}"
          cat > body.md <<EOF
          ## 安装

          | 平台 | 下载 | 使用方式 |
          |---|---|---|
          | Windows | \`wbspy.exe\` | 下载后直接命令行运行：\`wbspy.exe web\`（无需安装 Python） |
          | Linux | \`wbspy-linux-x86_64.AppImage\` | \`chmod +x wbspy-linux-x86_64.AppImage && ./wbspy-linux-x86_64.AppImage web\`（需 glibc 2.35+） |
          | macOS (Apple Silicon) | \`wbspy-macos-arm64\` | \`chmod +x wbspy-macos-arm64 && ./wbspy-macos-arm64 web\` |
          | macOS (Intel) | \`wbspy-macos-x86_64\` | \`chmod +x wbspy-macos-x86_64 && ./wbspy-macos-x86_64 web\` |
          | pip（全平台） | \`wbspy-${TAG#v}-py3-none-any.whl\` 或源码 | \`pip install . && wbspy web\` |
          | Docker | 见 README | \`docker compose up -d\` |

          启动 \`web\` 后浏览器打开提示的地址：扫码登录 → 自动化托管 → OpenAI 兼容网关。
          检查更新：\`wbspy update\`（国内网络自动走 DoH / 优选 IP）。

          ## 本版变更

          $(git log $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null)..HEAD --oneline 2>/dev/null || true)

          ---
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.client_payload.tag || github.ref_name }}
          body_path: body.md
          generate_release_notes: true        # 自动 notes 追加在 body 之后
          files: dist/*
