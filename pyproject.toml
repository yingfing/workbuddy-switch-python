[project]
name = "wbspy"
version = "0.2.1"
description = "WorkBuddy Switch Python 版：多账号切换、扫码登录、积分自动化、统一 OpenAI 网关"
requires-python = ">=3.9"
dependencies = ["requests>=2.31", "fastapi>=0.110", "uvicorn>=0.29"]
[project.optional-dependencies]
qr = ["qrcode>=7"]
[project.scripts]
wbspy = "wbspy.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["wbspy*"]
[tool.setuptools.package-data]
wbspy = ["data/*.json", "static/*.html"]
